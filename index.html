<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIR-OPS AI – Air Operations Decision Support</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1220;--pn:#111c2e;--pn2:#16243a;--ink:#e6edf5;--mu:#8a9bb0;--ln:#233450;--ac:#2fb8e6;--ok:#34c38f;--wn:#f0b429;--bd:#ef5b5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.5 Manrope,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.1}h2{font-size:1.4rem;font-weight:800;margin-bottom:12px}h3{font-size:1rem;font-weight:700;margin-bottom:8px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.mono{font-family:"IBM Plex Mono",monospace}.mu{color:var(--mu)}.ok{color:var(--ok)}.wn{color:var(--wn)}.bd{color:var(--bd)}.ac{color:var(--ac)}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lc{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:28px;width:100%;max-width:380px}
.lc h1{font-size:2rem;font-weight:800;letter-spacing:.02em}
.lc label{display:block;margin:14px 0 4px;color:var(--mu);font-size:.85rem}
.lc input,.lc select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:10px}
.bt{background:var(--ac);color:#04121c;border:0;border-radius:6px;padding:9px 16px;font-weight:700;margin:0 8px 8px 0}.bt.g{background:none;color:var(--ink);border:1px solid var(--ln)}.bt.r{background:var(--bd);color:#fff}
.bt:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--pn);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.hb{background:none;border:1px solid var(--ln);border-radius:6px;padding:4px 10px}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--ok)}.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}.deg .live{color:var(--wn)}.deg .live i{background:var(--wn)}
@keyframes pl{50%{opacity:.3;transform:scale(1.6)}}
.sp{flex:1}.hs{font-size:.8rem}
.shell{display:grid;grid-template-columns:1fr}
nav{position:fixed;top:0;bottom:0;left:0;width:220px;background:var(--pn);border-right:1px solid var(--ln);padding:60px 10px 10px;transform:translateX(-100%);transition:transform .25s;z-index:9;overflow:auto}
nav.o{transform:none}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:10px 12px;color:var(--mu);font-weight:700}
nav button[aria-current="true"]{background:var(--pn2);color:var(--ac)}
@media(min-width:900px){.shell{grid-template-columns:220px 1fr}nav{position:sticky;top:50px;height:calc(100vh - 50px);transform:none;padding-top:10px}.hb{display:none}}
main{padding:16px;min-width:0;max-width:1100px;width:100%;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;min-width:0;transition:border-color .2s}.cd:hover{border-color:#2f4a70}
.kv{font:800 2rem/1 Manrope;margin:4px 0}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .6s}
.row{display:grid;grid-template-columns:140px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:.9rem}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--ln);font-size:.9rem}th{color:var(--mu);font-weight:500}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--pn2)}
.tag{display:inline-block;border-radius:10px;padding:1px 9px;font-size:.78rem;font-weight:700;border:1px solid currentColor}
.hap{border:1px dashed var(--wn);color:var(--wn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:700}
.ban{position:fixed;left:0;right:0;z-index:11;text-align:center;padding:6px 10px;font-weight:700}
#dm{top:calc(52px + env(safe-area-inset-top,0px));background:var(--ac);color:#04121c}#dg{bottom:0;background:var(--wn);color:#241a00}
.ev{max-height:230px;overflow:auto;font-size:.88rem}.ev div{border-top:1px solid var(--ln);padding:5px 0;animation:fi .4s}
.sl{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;margin:8px 0}.sl input{width:100%}
.sw{padding:12px;border-radius:8px;background:var(--pn2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sn .7s linear infinite;vertical-align:middle}@keyframes sn{to{transform:rotate(360deg)}}
.toast{position:fixed;right:12px;bottom:12px;background:var(--pn2);border:1px solid var(--ac);padding:10px 14px;border-radius:8px;z-index:20;animation:fi .3s;max-width:80vw}
svg{display:block;max-width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="login"><form class="lc" id="lf"><h1>AIR-OPS AI</h1><p class="mu" style="margin:6px 0 0">AI-Assisted Air Operations Decision Support</p>
<label for="u">Username</label><input id="u" value="planner.demo" autocomplete="off"><label for="p">Password</label><input id="p" type="password" value="demo1234"><label for="r">Role</label>
<select id="r"><option>Operations Planner</option><option>Administrator</option><option>Maintenance Analyst</option><option>Logistics Analyst</option><option>Executive</option></select>
<button class="bt" style="width:100%;margin-top:18px" type="submit">Sign in</button><p class="mu" style="text-align:center;font-size:.8rem;margin:6px 0 0">Secure • Explainable • Human-in-the-Loop<br>Synthetic demo data only</p></form></div>
<div id="app" hidden>
<header id="hd"><button class="hb" id="hm" aria-label="Menu">☰</button><b style="font-size:1.1rem">AIR-OPS AI</b><span class="live"><i></i>LIVE</span><span class="sp"></span><span class="hs mono" id="clk"></span><span class="hs mu" id="sy"></span><button class="bt g" id="dg2" style="margin:0;padding:4px 10px">Degraded mode</button><button class="bt" id="dmb" style="margin:0;padding:6px 12px">DEMO MODE ▶ Simulate event</button><span class="hs" id="us"></span></header>
<div id="dm" class="ban" hidden></div>
<div class="shell"><nav id="nv"></nav><main id="mn"></main></div>
<div id="dg" class="ban" hidden></div></div>
<script>
const $=i=>document.getElementById(i),T=()=>new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
const S={role:"",pg:"ov",m:{ac:88,cr:90,we:84,re:86,dq:94},ev:false,rec:null,appr:null,deg:false,al:[],au:[],lg:[[T(),"Aircraft status refreshed"],[T(),"Weather feed refreshed"]],sel:null,why:false,conf:{},sim:null,sync:T(),runSim:false,ack:{}};
const AC=[["A-101","Active","Ready","Clear",92,"Crew Delta",71],["A-102","Active","Ready","Clear",90,"Crew Echo",68],["A-103","Available","Ready","Due in 40 h",84,"Crew Foxtrot",62],["A-104","Maintenance","Rest required","In service",41,"Unassigned",0],["A-105","Available","Ready","Clear",89,"Crew Golf",55],["A-106","Limited","Ready","Inspection due",72,"Crew Hotel",64],["A-107","Reserve","Ready","Clear",91,"Crew India",20],["A-108","Available","Training","Clear",86,"Crew Juliet",48]];
const PG=[["ov","Overview"],["ac","Aircraft"],["ai","AI Decision Center"],["df","Data Fusion Center"],["sm","Digital Twin & Simulation"],["al","Alerts & Audit"]];
const cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const calc=(a,c,w,r)=>{const rd=Math.round(.4*a+.25*c+.2*w+.15*r);return{rd,dl:cl(Math.round(100-rd*1.05+(100-w)*.15),3,95),ld:cl(Math.round(115-(r*.6+a*.4)+(100-w)*.2),10,99)}};
const col=v=>v>=80?"ok":v>=60?"wn":"bd";
const log=t=>{S.lg.unshift([T(),t]);if(S.lg.length>30)S.lg.pop()},aud=(a,d)=>S.au.unshift([T(),S.role||"System",a,d]);
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
const spk=(v,c)=>{const mn=Math.min(...v),mx=Math.max(...v);return `<svg viewBox="0 0 100 26" width="100%" height="26"><polyline fill="none" stroke="${c}" stroke-width="2" points="${v.map((y,i)=>(i*100/(v.length-1))+","+(24-(y-mn)/((mx-mn)||1)*22)).join(" ")}"/></svg>`};
const bar=(l,v,c)=>`<div class="row"><span>${l}</span><div class="bar"><i style="width:${v}%;${c?"background:var(--"+c+")":""}"></i></div><b class="mono">${v}%</b></div>`;
$("lf").onsubmit=e=>{e.preventDefault();S.role=$("r").value;$("login").hidden=true;$("app").hidden=false;$("us").textContent=$("u").value+" · "+S.role;aud("Login","Secure session started");nav();go("ov")};
function nav(){$("nv").innerHTML=PG.map(p=>`<button data-p="${p[0]}" aria-current="${p[0]===S.pg}">${p[1]}</button>`).join("");$("nv").querySelectorAll("button").forEach(b=>b.onclick=()=>{go(b.dataset.p);$("nv").classList.remove("o")})}
$("hm").onclick=()=>$("nv").classList.toggle("o");
function go(p){S.pg=p;nav();render();scrollTo(0,0)}
setInterval(()=>{if(!$("app").hidden)$("clk").textContent=T()},1000);
setInterval(()=>{if(S.deg||$("app").hidden)return;log(["Aircraft status refreshed","Weather feed refreshed","Crew roster synced","Maintenance database synced"][Math.random()*4|0]);S.sync=T();$("sy").textContent="Last sync "+S.sync;if(S.pg==="ov")render()},6000);
function render(){const f={ov,ac,ai,df,sm,al}[S.pg];$("mn").innerHTML=f();wire();$("sy").textContent="Last sync "+S.sync;$("hd").classList.toggle("deg",S.deg)}
function risk(){const m=S.m;return[["Weather",100-m.we],["Crew",100-m.cr],["Aircraft",100-m.ac],["Maintenance",S.ev?55:28],["Resources",100-m.re],["Data quality",100-m.dq]]}
function radar(){const r=risk(),C=100,pt=(i,v)=>{const a=i*Math.PI/3-Math.PI/2,d=v*.8;return[(C+Math.cos(a)*d).toFixed(1),(C+Math.sin(a)*d).toFixed(1)]};
const o=r.reduce((s,x)=>s+x[1],0)/6,lv=o>40?["High","bd"]:o>25?["Moderate","wn"]:["Low","ok"];
return `<svg viewBox="0 0 200 200" width="220">${[.33,.66,1].map(k=>`<polygon fill="none" stroke="var(--ln)" points="${r.map((_,i)=>pt(i,100*k).join(",")).join(" ")}"/>`).join("")}<polygon fill="rgba(47,184,230,.25)" stroke="var(--ac)" stroke-width="2" points="${r.map((x,i)=>pt(i,x[1]).join(",")).join(" ")}"/>${r.map((x,i)=>{const p=pt(i,118);return `<text x="${p[0]}" y="${p[1]}" font-size="9" fill="var(--mu)" text-anchor="middle">${x[0]}</text>`}).join("")}</svg><p>Overall risk: <b class="${lv[1]}">${lv[0]}</b></p>`}
function ov(){const m=S.m,k=calc(m.ac,m.cr,m.we,m.re),ready=AC.filter(a=>a[1]==="Active"||a[1]==="Available"||a[1]==="Reserve").length-(S.ev?1:0),atr=AC.filter(a=>a[4]<75).length+(S.ev?1:0);
const K=[["Operational readiness",k.rd+"%",k.rd,[80,82,85,84,86,k.rd]],["Available aircraft",ready+"/8",ready*12.5,[7,6,7,6,7,ready]],["Ready crew",m.cr+"%",m.cr,[88,90,89,91,90,m.cr]],["Active missions","6",75,[4,5,5,6,6,6]],["At-risk assets",""+atr,100-atr*12,[2,2,3,2,2,atr]],["Data quality",m.dq+"%",m.dq,[95,94,96,94,94,m.dq]]];
const aw=Math.round((m.ac+m.cr+m.we+m.re+m.dq)/5);
return `<h2>Operational overview</h2>${S.rec&&!S.appr?`<div class="hap">⚠ AI recommendation awaiting human approval. <a href="#" data-p="ai" class="ac">Review now</a></div>`:""}
<div class="g g3">${K.map(x=>`<div class="cd"><span class="mu">${x[0]}</span><div class="kv ${col(x[2])}">${x[1]}</div>${spk(x[3],"var(--ac)")}</div>`).join("")}</div>
<div class="g g2" style="margin-top:12px"><div class="cd"><h3>AI situation awareness: <span class="${col(aw)}">${aw}</span></h3>${bar("Aircraft readiness",m.ac)}${bar("Crew readiness",m.cr)}${bar("Weather stability",m.we)}${bar("Resource availability",m.re)}${bar("Data quality",m.dq)}</div>
<div class="cd"><h3>Early warning risk radar</h3>${radar()}</div></div>
<div class="cd" style="margin-top:12px"><h3>Live event stream</h3><div class="ev">${S.lg.map(x=>`<div><span class="mono mu">${x[0]}</span> ${x[1]}</div>`).join("")}</div></div>`}
function ac(){const d=S.sel?AC.find(a=>a[0]===S.sel):null;return `<h2>Aircraft</h2><div class="cd" style="overflow-x:auto"><table><tr><th>Aircraft</th><th>Status</th><th>Crew</th><th>Maintenance</th><th>Readiness</th></tr>${AC.map(a=>{const st=S.ev&&a[0]==="A-103"?"Maintenance":a[1],r=S.ev&&a[0]==="A-103"?38:a[4];return `<tr class="cl" data-a="${a[0]}"><td><b>${a[0]}</b></td><td>${st}</td><td>${a[2]}</td><td>${a[3]}</td><td class="${col(r)}"><b>${r}</b></td></tr>`}).join("")}</table></div>
${d?`<div class="cd" style="margin-top:12px"><h3>${d[0]} details</h3><p>Utilization ${d[6]}% · Crew assignment ${d[5]} · Last updated ${S.sync}</p><p>Maintenance prediction: <b class="${d[0]==="A-103"&&S.ev?"bd":"ok"}">${d[0]==="A-103"&&S.ev?"82% probability within 18 hours":"No fault predicted in the next 48 hours"}</b></p></div>`:`<p class="mu">Select an aircraft to see details.</p>`}`}
function ai(){const r=S.rec;if(!r)return `<h2>AI decision center</h2><div class="hap">Human approval required for every recommendation</div><div class="cd"><p>No recommendation needed. Conditions are within normal limits.</p><p class="mu">Run <b>DEMO MODE</b> to simulate a changing situation.</p></div>`;
return `<h2>AI decision center</h2><div class="hap">Human approval required. AI only recommends; the planner decides.</div>
<div class="cd"><span class="tag bd">${r.sev}</span> <span class="mu">Confidence</span> <b>${r.cf}%</b><h3 style="margin-top:8px">Operational schedule requires review</h3><p class="mu">Reason: aircraft availability changed, weather conditions changed, resource capacity reduced.</p><p>Expected impact: readiness ${r.from}% → ${r.to}% if the alternative plan is adopted.</p>
<button class="bt" data-x="why">View reasoning</button><button class="bt g" data-x="sim">Run simulation</button>${S.appr?`<span class="ok"><b>${S.appr}</b></span>`:`<button class="bt" data-x="ok">Approve</button><button class="bt r" data-x="no">Reject</button>`}</div>
${S.why?`<div class="cd" style="margin-top:12px;border-color:var(--ac)"><h3>Why is the AI recommending this?</h3>${r.dr.map(x=>bar(x[0],x[1],x[1]>60?"wn":"")).join("")}<p class="mu">Data sources used: Aircraft system, Crew system, Weather feed, Maintenance database, Logistics database</p><p>AI confidence score: <b>${r.cf}%</b></p></div>`:""}
<div class="g g2" style="margin-top:12px">${[["Primary plan","Keep schedule",r.from-0,r.risk+"%","High",r.cf-14],["Alternative plan B","Reassign reserve aircraft A-107, re-sequence flights, defer non-critical training",r.to,"Moderate","Moderate",r.cf],["Fallback","Reduce flights to critical tasks",r.to-9,"Low","Low",r.cf-6]].map(p=>`<div class="cd"><h3>${p[0]}</h3><p class="mu">${p[1]}</p><p>Readiness <b>${p[2]}%</b> · Risk <b>${p[4]}</b> · Confidence <b>${p[5]}%</b></p></div>`).join("")}</div>`}
function df(){const src=[["Aircraft",96],["Crew",94],["Weather",S.ev?88:97],["Maintenance",S.ev?90:95],["Logistics",93]],cf=S.ev&&!S.conf.A103;return `<h2>Data fusion center</h2><div class="g g2"><div class="cd"><h3>Source health</h3>${src.map(s=>bar(s[0],s[1],s[1]<90?"wn":"")).join("")}</div>
<div class="cd"><h3>Conflict detection engine</h3>${cf?`<p><b>Aircraft A-103</b></p><p>Source A (aircraft system): <b class="ok">Available</b><br>Source B (maintenance database): <b class="bd">Maintenance</b></p><p>Conflict detected · confidence 62%</p><button class="bt" data-x="cf">Review conflict</button>`:S.conf.A103?`<p class="ok"><b>A-103 conflict resolved: ${S.conf.A103}</b></p>`:`<p class="ok">No conflicts detected across 5 sources.</p>`}</div></div>`}
function sm(){const m=S.sm||{ac:S.m.ac,cr:S.m.cr,we:S.m.we,re:S.m.re},c=calc(S.m.ac,S.m.cr,S.m.we,S.m.re),s=calc(m.ac,m.cr,m.we,m.re),al=[s.ld>80?"Resource overload":"",s.dl>35?"High delay risk":"",s.rd<75?"Readiness below target":""].filter(Boolean);
const sl=(k,l)=>`<div class="sl"><label for="s${k}">${l}</label><input id="s${k}" type="range" min="30" max="100" value="${m[k]}" data-k="${k}"><b class="mono" id="v${k}">${m[k]}%</b></div>`;
return `<h2>Digital twin & simulation lab</h2><div class="g g2"><div class="cd"><h3>Scenario inputs</h3>${sl("ac","Aircraft availability")}${sl("cr","Crew availability")}${sl("we","Weather stability")}${sl("re","Resource capacity")}<button class="bt" data-x="run">Run simulation</button><button class="bt g" data-x="rs">Reset</button></div>
<div class="cd"><h3>Current vs simulated ${S.runSim?`<span class="spin"></span>`:""}</h3><table><tr><th></th><th>Current</th><th>Simulated</th></tr>${[["Readiness",c.rd,s.rd,"%"],["Delay risk",c.dl,s.dl,"%"],["Resource load",c.ld,s.ld,"%"]].map(x=>`<tr><td>${x[0]}</td><td class="mono">${x[1]}${x[3]}</td><td class="mono ${x[2]===x[1]?"":x[0]==="Readiness"?(x[2]>x[1]?"ok":"bd"):(x[2]>x[1]?"bd":"ok")}"><b>${x[2]}${x[3]}</b></td></tr>`).join("")}</table><p>Alerts: ${al.length?al.map(a=>`<span class="tag wn">${a}</span>`).join(" "):`<span class="ok">None</span>`}</p><div class="sw"><b>AI analysis:</b> ${s.rd<c.rd-5?"Scenario indicates increased operational pressure.":s.rd>c.rd+2?"Scenario improves readiness.":"Scenario is close to the current state."} Human review recommended.</div></div></div>`}
function al(){const A=S.al;return `<h2>Alerts & audit trail</h2><div class="cd">${A.length?A.map((a,i)=>`<div style="border-top:1px solid var(--ln);padding:8px 0"><span class="tag ${a[0]==="Critical"?"bd":"wn"}">${a[0]}</span> ${a[1]} <span class="mu mono">${a[2]}</span> ${S.ack[i]?`<span class="ok">Acknowledged</span>`:`<button class="bt g" style="padding:2px 10px;margin:0 0 0 8px" data-k="${i}">Acknowledge</button>`}</div>`).join(""):`<p class="mu">No active alerts.</p>`}</div>
<div class="cd" style="margin-top:12px;overflow-x:auto"><h3>Audit trail</h3><table><tr><th>Time</th><th>User</th><th>Action</th><th>Decision</th></tr>${S.au.map(a=>`<tr><td class="mono">${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td></tr>`).join("")}</table></div>`}
function wire(){const q=(s,f)=>$("mn").querySelectorAll(s).forEach(f);
q("[data-p]",b=>b.onclick=e=>{e.preventDefault();go(b.dataset.p)});q("[data-a]",r=>r.onclick=()=>{S.sel=r.dataset.a;render()});
q("[data-k]",b=>{if(b.tagName==="BUTTON")b.onclick=()=>{S.ack[b.dataset.k]=1;aud("Acknowledge alert",S.al[b.dataset.k][1]);render()}});
q("[data-x]",b=>b.onclick=()=>act(b.dataset.x));
q("input[type=range]",i=>{i.oninput=()=>$("v"+i.dataset.k).textContent=i.value+"%";i.onchange=()=>{S.sm=S.sm||{...S.m};S.sm[i.dataset.k]=+i.value;render()}})}
function act(x){if(x==="why"){S.why=!S.why;render()}
else if(x==="sim"){S.sm={ac:S.m.ac+5,cr:S.m.cr,we:S.m.we,re:S.m.re+10};go("sm");sim()}
else if(x==="ok"||x==="no"){S.appr=x==="ok"?"Approved by "+S.role:"Rejected by "+S.role;aud(x==="ok"?"Approve recommendation":"Reject recommendation","Alternative plan B");log("Planner decision: "+S.appr);if(x==="ok"){S.m.ac=84;S.m.re=82}toast(S.appr);render()}
else if(x==="cf"){S.conf.A103="treated as Maintenance (Source B)";aud("Resolve data conflict","A-103 treated as Maintenance");render()}
else if(x==="run")sim();else if(x==="rs"){S.sm=null;render()}}
function sim(){S.runSim=true;render();setTimeout(()=>{S.runSim=false;aud("Run simulation","Scenario evaluated");render()},800)}
$("dg2").onclick=()=>{S.deg=!S.deg;$("dg").hidden=!S.deg;$("dg").textContent="Network degraded · last sync "+S.sync+" · using last validated data";log(S.deg?"Network degraded: using last validated data":"Network restored");render()};
$("dmb").onclick=()=>{if(S.ev)return toast("Demo already ran. Reload to restart.");S.ev=true;const b=$("dm");
